<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lidiane &amp; Celio – Nossos Convites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: #e8e0d5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      gap: 32px;
    }

    /* ── Hero foto ── */
    .hero {
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,.15);
    }

    .hero img {
      width: 100%;
      display: block;
    }

    /* ── Título central ── */
    .title-block {
      text-align: center;
    }

    .title-block h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 300;
      color: #1a1a2e;
    }

    .title-block h1 em {
      font-style: italic;
      color: #a07850;
    }

    .title-block p {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #9a9a9a;
      font-weight: 300;
      margin-top: 8px;
    }

    /* ── Cards dos eventos ── */
    .events {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 480px;
      width: 100%;
    }

    .event-card {
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,.10);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 20px;
      transition: transform .15s, box-shadow .15s;
    }

    .event-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,.15);
    }

    .event-card .ev-icon {
      width: 52px;
      height: 52px;
      background: #1a1a2e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .event-card .ev-info {
      flex: 1;
    }

    .event-card .ev-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #a07850;
      margin-bottom: 4px;
    }

    .event-card .ev-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .event-card .ev-date {
      font-size: 13px;
      font-weight: 300;
      color: #666;
    }

    .event-card .ev-arrow {
      font-size: 20px;
      color: #c9a87c;
    }

    /* ── Deadline warning ── */
    .deadline-warning {
      max-width: 480px;
      width: 100%;
      background: #fff3f3;
      border: 2px solid #d4263e;
      border-radius: 4px;
      padding: 16px 20px;
      text-align: center;
      font-size: 13px;
      color: #444;
      font-weight: 300;
      line-height: 1.6;
    }

    .deadline-warning strong {
      font-weight: 700;
      color: #d4263e;
    }

    /* ── Footer ── */
    .footer {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-style: italic;
      color: #b0966e;
    }
  </style>
</head>
<body>

  <div class="hero">
    <img src="foto-casal.jpg" alt="Lidiane e Celio" />
  </div>

  <div class="title-block">
    <h1>Lidiane <em>&amp;</em> Celio</h1>
    <p>Selecione seu convite</p>
  </div>

  <div class="events">
    <a class="event-card" href="cartorio.html">
      <div class="ev-icon">🏛️</div>
      <div class="ev-info">
        <div class="ev-label">Cerimônia Civil</div>
        <div class="ev-title">Cartório do Roça Grande</div>
        <div class="ev-date">16 de julho · 15h50</div>
      </div>
      <span class="ev-arrow">›</span>
    </a>

    <a class="event-card" href="jantar.html">
      <div class="ev-icon">🥂</div>
      <div class="ev-info">
        <div class="ev-label">Jantar de Celebração</div>
        <div class="ev-title">Churrascaria Berckemback</div>
        <div class="ev-date">24 de julho · 19h30</div>
      </div>
      <span class="ev-arrow">›</span>
    </a>
  </div>

  <div class="deadline-warning">
    ⚠️ <strong>Confirmação obrigatória até 17 de julho.</strong><br />
    Abra seu convite e confirme presença pelo WhatsApp.
  </div>

  <p class="footer">Com amor, Lidiane &amp; Celio</p>

</body>
</html>
